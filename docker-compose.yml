version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: visitorpass-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: visitor-pass-db
    volumes:
      - mongodb_data:/data/db
    networks:
      - visitorpass-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: visitorpass-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/visitor-pass-db
      CLIENT_URL: http://localhost:5173
      SERVER_URL: http://localhost:5000
    depends_on:
      - mongodb
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/public:/app/public
    networks:
      - visitorpass-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: visitorpass-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - visitorpass-network

volumes:
  mongodb_data:

networks:
  visitorpass-network:
    driver: bridge
